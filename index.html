const VIDEOS = RAW.split("\n").map(l => {
  const i = l.indexOf("|");
  const titulo = l.slice(i + 1);
  return { id: l.slice(0, i), titulo, aba: classificar(titulo) };
});

const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text) e.textContent = text;
  return e;
}

let mostrar = 12, atual = null;
function render(chave) {
  const aba = ABAS.find(a => a.chave === chave) || ABAS[0];
  if (aba.chave !== atual) { mostrar = 12; atual = aba.chave; }
  [...tabsEl.children].forEach(b => b.setAttribute("aria-selected", String(b.dataset.chave === aba.chave)));
  contentEl.replaceChildren();
  const lista = VIDEOS.filter(v => v.aba === aba.chave);

  if (!lista.length) {
    contentEl.append(el("p", { class:"empty" }, "Nenhum vídeo neste tópico ainda."));
    return;
  }

  lista.slice(0, mostrar).forEach((v, i) => {
    const bloco = el("div");
    bloco.append(el("p", { class:"eyebrow" }, i === 0 ? "Vídeo em destaque" : "Vídeo"));
    bloco.append(el("h1", {}, v.titulo));

    const intro = el("p", { class:"intro" });
    intro.append("O vídeo está incorporado abaixo. Se o player não carregar, você pode abri-lo diretamente no ");
    const a = el("a", { href:`https://www.bitchute.com/video/${v.id}/`, target:"_blank", rel:"noopener" }, "BitChute");
    intro.append(a, ".");
    bloco.append(intro);

    const card = el("section", { class:"video-card", "aria-label":"Player de vídeo" });
    const wrap = el("div", { class:"video" });
    wrap.append(el("iframe", {
      src:`https://www.bitchute.com/embed/${v.id}/`,
      title:v.titulo,
      allowfullscreen:"",
      loading:"lazy"
    }));
    card.append(wrap);
    bloco.append(card);
    contentEl.append(bloco);
  });

  if (lista.length > mostrar) {
    const mais = el("button", { class:"mais" }, `Mostrar mais (${lista.length - mostrar} restantes)`);
    mais.addEventListener("click", () => { mostrar += 24; render(aba.chave); });
    contentEl.append(mais);
  }
}

ABAS.forEach(a => {
  const b = el("button", { role:"tab", "data-chave":a.chave, "aria-selected":"false" }, `${a.nome} (${VIDEOS.filter(v => v.aba === a.chave).length})`);
  b.addEventListener("click", () => { location.hash = a.chave; render(a.chave); });
  tabsEl.append(b);
});

window.addEventListener("hashchange", () => render(location.hash.slice(1)));
render(location.hash.slice(1));
</script>
